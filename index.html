        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #070a16;
                --bg-2: #0c1226;
                --panel: rgba(255,255,255,0.045);
                --panel-strong: rgba(255,255,255,0.07);
                --border: rgba(255,255,255,0.12);
                --border-strong: rgba(255,255,255,0.22);
                --ink: #EDEFF7;
                --muted: #8b93ab;
                --muted-dim: #5c6480;
                --accent: #5b9cf6;
                --accent-bright: #9cc7ff;
                --accent-2: #9c7cf6;
                --accent-dim: rgba(91,156,246,0.16);
                --accent-line: rgba(91,156,246,0.45);
                --shadow: 0 30px 80px rgba(91,156,246,0.10), 0 14px 40px rgba(0,0,0,0.55);
                --cursor-ring: #9cc7ff;
                --cursor-dot: #ffffff;
            }

            * {
                box-sizing: border-box;
                cursor: none !important;
            }

            html,body {
                height: 100%;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: 'Inter', sans-serif;
                min-height: 100vh;
                overflow-x: hidden;
                position: relative;
                -webkit-font-smoothing: antialiased;
                cursor: none;
            }

            /* CUSTOM CURSOR STYLES */
            .custom-cursor {
                position: fixed;
                top: 0;
                left: 0;
                pointer-events: none;
                z-index: 9999;
                mix-blend-mode: screen;
            }

            .cursor-ring {
                position: fixed;
                width: 32px;
                height: 32px;
                border: 2px solid var(--cursor-ring);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9998;
                transform: translate(-50%, -50%);
                transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background 0.2s ease;
                box-shadow: 0 0 12px rgba(91,156,246,0.5), 0 0 30px rgba(91,156,246,0.2);
                animation: cursorPulse 2s infinite ease-in-out;
                opacity: 0;
            }

            .cursor-dot {
                position: fixed;
                width: 6px;
                height: 6px;
                background: var(--cursor-dot);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                box-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 15px rgba(91,156,246,0.8);
                opacity: 0;
            }

            @keyframes cursorPulse {
                0%, 100% { box-shadow: 0 0 12px rgba(91,156,246,0.5), 0 0 30px rgba(91,156,246,0.2); }
                50% { box-shadow: 0 0 18px rgba(91,156,246,0.8), 0 0 45px rgba(91,156,246,0.4); }
            }

            .cursor-ring.clicking {
                width: 42px;
                height: 42px;
                border-color: var(--accent-bright);
                background: rgba(91,156,246,0.15);
                transition: width 0.1s ease, height 0.1s ease, background 0.1s ease;
            }

            /* Cursor particle container */
            .cursor-particles {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9997;
                overflow: hidden;
            }

            .cursor-particle {
                position: fixed;
                border-radius: 50%;
                pointer-events: none;
                animation: particleFly 0.8s ease-out forwards;
            }

            @keyframes particleFly {
                0% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
                100% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0) translate(var(--px), var(--py));
                }
            }

            /* Active element hover state */
            .cursor-ring.hovering {
                width: 48px;
                height: 48px;
                background: rgba(91,156,246,0.2);
                border-color: white;
                animation: none;
            }

            ::selection {
                background: var(--accent-dim);
                color: var(--accent-bright);
            }

            ::-webkit-scrollbar {
                width: 10px;
            }

            ::-webkit-scrollbar-track {
                background: var(--bg);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--panel-strong);
                border-radius: 10px;
                border: 2px solid var(--bg);
            }

            html {
                scrollbar-color: var(--panel-strong) var(--bg);
            }

            /* ---------- Night-sky background layers ---------- */
            .aurora {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                overflow: hidden;
                background: radial-gradient(120% 80% at 50% -10%, var(--bg-2), var(--bg) 60%);
            }

            .aurora .blob {
                position: absolute;
                border-radius: 50%;
                filter: blur(80px);
                opacity: 0.22;
            }

            .aurora .b1 {
                width: 420px;
                height: 420px;
                top: -160px;
                left: -120px;
                background: #5b9cf6;
                animation: drift1 24s ease-in-out infinite alternate;
            }

            .aurora .b2 {
                width: 380px;
                height: 380px;
                bottom: -180px;
                right: -100px;
                background: #6a5cf6;
                opacity: 0.18;
                animation: drift2 28s ease-in-out infinite alternate;
            }

            @keyframes drift1 {
                0% { transform: translate(0,0); }
                100% { transform: translate(40px,30px); }
            }

            @keyframes drift2 {
                0% { transform: translate(0,0); }
                100% { transform: translate(-30px,-25px); }
            }

            .parallax-layer {
                position: fixed;
                inset: -24px;
                z-index: 0;
                pointer-events: none;
                transition: transform .18s ease-out;
                will-change: transform;
            }

            .stars-static {
                position: absolute;
                inset: 0;
            }

            .star-static {
                position: absolute;
                border-radius: 50%;
                background: #cfe4ff;
                animation-name: twinkleStatic;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
            }

            @keyframes twinkleStatic {
                0%,100% { opacity: .15; transform: scale(.8); }
                50% { opacity: .95; transform: scale(1.2); }
            }

            .stars-falling {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                overflow: hidden;
            }

            .falling-star {
                position: absolute;
                top: -12px;
                border-radius: 50%;
                background: radial-gradient(circle, #eaf4ff 0%, #5b9cf6 45%, transparent 75%);
                box-shadow: 0 0 8px 1px rgba(91,156,246,0.65);
                animation-name: fallStar;
                animation-timing-function: linear;
                animation-iteration-count: infinite;
                will-change: transform, opacity;
            }

            @keyframes fallStar {
                0% { transform: translate(0,0) rotate(0deg); opacity: 0; }
                6% { opacity: 1; }
                90% { opacity: .8; }
                100% { transform: translate(var(--drift,0px), 112vh) rotate(180deg); opacity: 0; }
            }

            .comets {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                overflow: hidden;
            }

            .comet {
                position: absolute;
                width: 2.5px;
                height: 2.5px;
                border-radius: 50%;
                background: #eaf4ff;
                box-shadow: 0 0 10px 2px rgba(91,156,246,0.9);
                will-change: transform, opacity;
            }

            .comet::after {
                content: '';
                position: absolute;
                top: 50%;
                right: 100%;
                width: 110px;
                height: 1.5px;
                background: linear-gradient(90deg, transparent, rgba(180,214,255,0.85));
                transform: translateY(-50%);
            }

            @keyframes cometMove {
                from { opacity: 1; transform: rotate(var(--angle,20deg)) translate(0,0); }
                to { opacity: 0; transform: rotate(var(--angle,20deg)) translate(var(--cx,300px), var(--cy,120px)); }
            }

            .cursor-glow {
                position: fixed;
                width: 280px;
                height: 280px;
                border-radius: 50%;
                left: 50%;
                top: 50%;
                transform: translate(-50%,-50%);
                background: radial-gradient(circle, rgba(91,156,246,0.16), transparent 70%);
                mix-blend-mode: screen;
                pointer-events: none;
                z-index: 1;
                opacity: 0;
                transition: opacity .35s ease;
            }

            .grain {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                opacity: 0.04;
                mix-blend-mode: overlay;
            }

            /* Crescent moon — creative addition */
            .moon {
                position: fixed;
                top: 6%;
                right: 9%;
                width: 64px;
                height: 64px;
                z-index: 0;
                pointer-events: none;
                filter: drop-shadow(0 0 18px rgba(159,199,255,0.55));
                animation: moonFloat 7s ease-in-out infinite;
            }

            @keyframes moonFloat {
                0%,100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }

            @media (max-width: 480px) {
                .moon { width:46px; height: 46px; top: 4%; right: 6%; }
            }

            /* ---------- Layout ---------- */
            main.sheet {
                position: relative;
                z-index: 2;
                max-width: 460px;
                margin: 0 auto;
                padding: 64px 22px 30px;
            }

            .sheet-inner {
                position: relative;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 28px;
                padding: 38px 26px 30px;
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                box-shadow: var(--shadow);
                animation: cardGlow 5s ease-in-out infinite;
            }

            @keyframes cardGlow {
                0%,100% { box-shadow: var(--shadow), 0 0 0px rgba(91,156,246,0); }
                50% { box-shadow: var(--shadow), 0 0 46px rgba(91,156,246,0.22); }
            }

            /* ---------- Hero ---------- */
            .hero {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .polaroid {
                position: relative;
                background: #f4f6fb;
                padding: 10px 10px 26px;
                border-radius: 10px;
                transform: rotate(-4deg);
                box-shadow: 0 18px 40px rgba(0,0,0,0.45);
                opacity: 0;
                animation: popIn .7s cubic-bezier(.34,1.56,.64,1) .05s forwards, settleRotate .7s ease-out .05s forwards;
                margin-bottom: 22px;
                transform-style: preserve-3d;
            }

            @keyframes settleRotate {
                from { transform: rotate(-12deg) scale(0.9); }
                to { transform: rotate(-4deg) scale(1); }
            }

            @keyframes popIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            .pfp {
                width: 132px;
                height: 132px;
                border-radius: 4px;
                object-fit: cover;
                display: block;
                filter: saturate(1.02) contrast(1.02);
                pointer-events: none;
            }

            .tape {
                position: absolute;
                top: -14px;
                left: 50%;
                transform: translateX(-50%) rotate(4deg);
                width: 74px;
                height: 26px;
                background: rgba(156,199,255,0.55);
                border: 1px solid rgba(255,255,255,0.5);
                box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            }

            .sparkle {
                position: absolute;
                top: -10px;
                right: -14px;
                width: 26px;
                height: 26px;
                color: var(--accent);
                animation: twinkle 2.2s ease-in-out infinite;
            }

            @keyframes twinkle {
                0%,100% { opacity: 0.5; transform: scale(0.85) rotate(0deg); }
                50% { opacity: 1; transform: scale(1.15) rotate(12deg); }
            }

            .name {
                position: relative;
                display: inline-block;
                margin: 0 0 14px;
                opacity: 0;
                animation: popIn .6s ease-out .18s forwards;
            }

            .marker {
                position: absolute;
                left: -8px;
                right: -8px;
                bottom: 6px;
                height: 16px;
                background: var(--accent-dim);
                border-radius: 3px;
                z-index: 0;
                transform: scaleX(0);
                transform-origin: left;
                animation: swipe .5s ease-out .5s forwards;
            }

            @keyframes swipe {
                to { transform: scaleX(1); }
            }

            .name-text {
                position: relative;
                z-index: 1;
                font-family: 'Baloo 2', sans-serif;
                font-weight: 700;
                font-size: 2.4rem;
                color: var(--ink);
                letter-spacing: 0.01em;
            }

            .handle {
                appearance: none;
                border: none;
                cursor: pointer;
                background: transparent;
                display: inline-flex;
                align-items: center;
                gap: 7px;
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.9rem;
                color: var(--muted);
                padding: 5px 10px;
                border-radius: 20px;
                border: 1px solid transparent;
                transition: color .2s ease, background .2s ease, border-color .2s ease;
                opacity: 0;
                animation: popIn .6s ease-out .28s forwards;
            }

            .handle:hover {
                color: var(--accent-bright);
                background: var(--accent-dim);
                border-color: var(--accent-line);
            }

            .handle:focus-visible {
                outline: 1.5px solid var(--accent);
                outline-offset: 2px;
            }

            .handle svg {
                width: 13px;
                height: 13px;
                opacity: 0.75;
            }

            .bubble {
                position: relative;
                margin-top: 18px;
                max-width: 280px;
                background: var(--panel-strong);
                border: 1px solid var(--border);
                border-radius: 16px 16px 16px 4px;
                padding: 12px 18px;
                opacity: 0;
                animation: popIn .6s ease-out .38s forwards;
            }

            .bubble p {
                margin: 0;
                font-family: 'Inter', sans-serif;
                font-weight: 500;
                font-size: 0.98rem;
                color: var(--ink);
                font-style: italic;
            }

            /* ---------- Sections ---------- */
            .section {
                margin-top: 38px;
                opacity: 0;
                animation: popIn .6s ease-out forwards;
            }

            .section.social-section { animation-delay: .46s; }
            .section.visit-section { animation-delay: .56s; }

            .tag-label {
                display: inline-block;
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.68rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--bg);
                background: var(--accent);
                padding: 5px 12px;
                border-radius: 8px;
                transform: rotate(-2deg);
                margin-bottom: 16px;
                box-shadow: 0 6px 14px rgba(91,156,246,0.25);
            }

            .social-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .social-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                background: var(--panel-strong);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 16px 8px 14px;
                text-decoration: none;
                color: inherit;
                cursor: pointer;
                appearance: none;
                font: inherit;
                transition: border-color .2s ease, transform .2s ease, background .2s ease;
            }

            .social-item:hover {
                border-color: var(--accent-line);
                transform: translateY(-4px);
                background: var(--accent-dim);
            }

            .social-item:focus-visible {
                outline: 1.5px solid var(--accent);
                outline-offset: 2px;
            }

            .social-circle {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--panel);
                border: 1px solid var(--border);
                color: var(--muted);
                transition: color .2s ease, border-color .2s ease, background .2s ease;
            }

            .social-item:hover .social-circle {
                color: var(--bg);
                background: var(--accent);
                border-color: var(--accent);
            }

            .social-circle svg {
                width: 19px;
                height: 19px;
            }

            .social-name {
                font-family: 'Inter', sans-serif;
                font-weight: 700;
                font-size: 0.78rem;
                color: var(--ink);
            }

            .social-user {
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.66rem;
                color: var(--muted-dim);
                word-break: break-all;
                text-align: center;
            }

            .visit-card {
                position: relative;
                overflow: hidden;
                display: flex;
                align-items: center;
                gap: 14px;
                background: linear-gradient(135deg, rgba(91,156,246,0.14), rgba(255,255,255,0.045));
                border: 1px solid var(--accent-line);
                border-radius: 18px;
                padding: 16px 18px;
                text-decoration: none;
                color: inherit;
                box-shadow: 0 12px 30px rgba(91,156,246,0.15);
                transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            }

            .visit-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 18px 40px rgba(91,156,246,0.25);
                border-color: var(--accent-bright);
            }

            .visit-card:focus-visible {
                outline: 1.5px solid var(--accent);
                outline-offset: 2px;
            }

            .visit-shine {
                position: absolute;
                top: 0;
                left: -60%;
                width: 40%;
                height: 100%;
                background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
                transform: skewX(-20deg);
                transition: left .6s ease;
                pointer-events: none;
            }

            .visit-card:hover .visit-shine {
                left: 120%;
            }

            .visit-icon {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--panel);
                border: 1px solid var(--border-strong);
                overflow: hidden;
            }

            .visit-icon img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .visit-info {
                display: flex;
                flex-direction: column;
                gap: 2px;
                flex: 1;
                min-width: 0;
            }

            .visit-title {
                font-family: 'Baloo 2', sans-serif;
                font-weight: 700;
                font-size: 1.05rem;
                color: var(--ink);
            }

            .visit-sub {
                font-family: 'Inter', sans-serif;
                font-size: 0.78rem;
                color: var(--muted);
            }

            .visit-arrow {
                width: 18px;
                height: 18px;
                flex: none;
                color: var(--accent-bright);
                transition: transform .2s ease;
            }

            .visit-card:hover .visit-arrow {
                transform: translate(3px,-3px);
            }

            /* Footer */
            .footer {
                position: relative;
                z-index: 2;
                text-align: center;
                padding: 25px 22px 45px;
                margin-top: 0px;
                opacity: 0;
                animation: popIn .6s ease-out .7s forwards;
            }

            .footer-text {
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.78rem;
                letter-spacing: 0.06em;
                color: var(--muted-dim);
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: color 0.3s ease;
            }

            .footer-text:hover {
                color: var(--accent-bright);
            }

            .footer-text .sparkle-small {
                width: 12px;
                height: 12px;
                color: var(--accent);
                animation: twinkle 2.5s ease-in-out infinite;
                display: inline-block;
            }

            .footer-text .year {
                color: var(--accent);
                font-weight: 600;
                text-shadow: 0 0 8px rgba(91,156,246,0.5);
            }

            @keyframes twinkle {
                0%,100% { opacity: 0.5; transform: scale(0.85) rotate(0deg); }
                50% { opacity: 1; transform: scale(1.15) rotate(12deg); }
            }

            /* Toast */
            .toast {
                position: fixed;
                left: 50%;
                bottom: 28px;
                transform: translate(-50%, 20px);
                background: var(--bg-2);
                border: 1px solid var(--accent-line);
                color: var(--ink);
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.8rem;
                padding: 11px 18px;
                border-radius: 12px;
                box-shadow: var(--shadow);
                opacity: 0;
                pointer-events: none;
                transition: opacity .25s ease, transform .25s ease;
                z-index: 10;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .toast.show {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            .toast .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 6px var(--accent);
                flex: none;
            }

            @media (max-width: 480px) {
                main.sheet { padding:48px 14px 20px; }
                .sheet-inner { padding: 32px 18px 26px; }
                .name-text { font-size: 2rem; }
                .social-user { font-size: 0.6rem; }
                .footer { padding: 20px 14px 35px; }
                .footer-text { font-size: 0.7rem; }
            }

            @media (prefers-reduced-motion: reduce) {
                .aurora .blob, .sparkle, .sheet-inner, .moon { animation: none !important; }
                .polaroid, .name, .handle, .bubble, .section, .marker, .footer {
                    animation: none !important;
                    opacity: 1 !important;
                }
                .polaroid { transform: rotate(-4deg) !important; }
                .marker { transform: scaleX(1) !important; }
                .star-static { animation-duration: 0s !important; opacity: .4; }
            }
        </style>
    </head>

        <div class="toast" id="toast">

        </div>
        <script>
            (function() {
                var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                var fine = window.matchMedia('(pointer:fine)').matches;

                /* ---------- CUSTOM CURSOR SYSTEM ---------- */
                const cursorRing = document.getElementById('cursorRing');
                const cursorDot = document.getElementById('cursorDot');
                const cursorParticles = document.getElementById('cursorParticles');
                
                let mouseX = window.innerWidth / 2;
                let mouseY = window.innerHeight / 2;
                let ringX = mouseX;
                let ringY = mouseY;
                let dotX = mouseX;
                let dotY = mouseY;
                let isHovering = false;
                let isClicking = false;
                let mouseDown = false;
                
                // Check if touch device
                const isTouchDevice = window.matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
                
                if (!isTouchDevice && fine) {
                    // Show custom cursor
                    cursorRing.style.opacity = '1';
                    cursorDot.style.opacity = '1';
                    
                    document.addEventListener('mousemove', (e) => {
                        mouseX = e.clientX;
                        mouseY = e.clientY;
                        
                        // Immediate dot position
                        dotX = mouseX;
                        dotY = mouseY;
                        cursorDot.style.left = dotX + 'px';
                        cursorDot.style.top = dotY + 'px';
                        
                        // Check hover state
                        const target = e.target;
                        if (target.closest('a, button, .social-item, .handle, .visit-card, input, [role="button"]')) {
                            isHovering = true;
                            cursorRing.classList.add('hovering');
                        } else {
                            isHovering = false;
                            cursorRing.classList.remove('hovering');
                        }
                    });
                    
                    // Smooth ring animation
                    function animateRing() {
                        ringX += (mouseX - ringX) * 0.15;
                        ringY += (mouseY - ringY) * 0.15;
                        
                        cursorRing.style.left = ringX + 'px';
                        cursorRing.style.top = ringY + 'px';
                        
                        if (!isTouchDevice && fine) {
                            requestAnimationFrame(animateRing);
                        }
                    }
                    
                    if (fine && !reduce) {
                        animateRing();
                    } else {
                        // Fallback: direct position
                        document.addEventListener('mousemove', (e) => {
                            cursorRing.style.left = e.clientX + 'px';
                            cursorRing.style.top = e.clientY + 'px';
                        });
                    }
                    
                    // Click particle effect
                    function spawnClickParticles(x, y) {
                        if (!fine || reduce) return;
                        
                        const colors = ['#5b9cf6', '#9cc7ff', '#eaf4ff', '#6a5cf6', '#ffffff', '#9c7cf6'];
                        const particleCount = 14;
                        
                        for (let i = 0; i < particleCount; i++) {
                            const particle = document.createElement('div');
                            particle.className = 'cursor-particle';
                            const size = 6 + Math.random() * 12;
                            const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.5;
                            const distance = 40 + Math.random() * 80;
                            const px = Math.cos(angle) * distance;
                            const py = Math.sin(angle) * distance;
                            const color = colors[Math.floor(Math.random() * colors.length)];
                            
                            particle.style.width = size + 'px';
                            particle.style.height = size + 'px';
                            particle.style.left = x + 'px';
                            particle.style.top = y + 'px';
                            particle.style.background = color;
                            particle.style.boxShadow = `0 0 ${size * 1.5}px ${color}, 0 0 ${size * 2.5}px rgba(91,156,246,0.7)`;
                            particle.style.setProperty('--px', px + 'px');
                            particle.style.setProperty('--py', py + 'px');
                            particle.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                            
                            cursorParticles.appendChild(particle);
                            
                            setTimeout(() => {
                                if (particle.parentNode) {
                                    particle.parentNode.removeChild(particle);
                                }
                            }, 1000);
                        }
                        
                        // Also create a ring burst
                        for (let i = 0; i < 6; i++) {
                            const ringBurst = document.createElement('div');
                            ringBurst.className = 'cursor-particle';
                            const angle = (Math.PI * 2 * i) / 6 + Math.random() * 0.4;
                            const distance = 25 + Math.random() * 45;
                            const px = Math.cos(angle) * distance;
                            const py = Math.sin(angle) * distance;
                            const size = 3 + Math.random() * 5;
                            
                            ringBurst.style.width = size + 'px';
                            ringBurst.style.height = size + 'px';
                            ringBurst.style.left = x + 'px';
                            ringBurst.style.top = y + 'px';
                            ringBurst.style.background = '#ffffff';
                            ringBurst.style.boxShadow = `0 0 ${size * 2}px #fff, 0 0 ${size * 4}px rgba(91,156,246,0.9)`;
                            ringBurst.style.setProperty('--px', px + 'px');
                            ringBurst.style.setProperty('--py', py + 'px');
                            ringBurst.style.animationDuration = '0.6s';
                            
                            cursorParticles.appendChild(ringBurst);
                            
                            setTimeout(() => {
                                if (ringBurst.parentNode) {
                                    ringBurst.parentNode.removeChild(ringBurst);
                                }
                            }, 800);
                        }
                    }
                    
                    // Mouse down effect
                    document.addEventListener('mousedown', (e) => {
                        if (e.button === 0) {
                            mouseDown = true;
                            isClicking = true;
                            cursorRing.classList.add('clicking');
                            spawnClickParticles(e.clientX, e.clientY);
                            
                            // Also trigger on mouseup to ensure effect
                            setTimeout(() => {
                                cursorRing.classList.remove('clicking');
                                isClicking = false;
                            }, 150);
                        }
                    });
                    
                    document.addEventListener('mouseup', (e) => {
                        if (e.button === 0) {
                            mouseDown = false;
                            isClicking = false;
                            cursorRing.classList.remove('clicking');
                        }
                    });
                    
                    // Hide cursor when leaving window
                    document.documentElement.addEventListener('mouseleave', () => {
                        cursorRing.style.opacity = '0';
                        cursorDot.style.opacity = '0';
                    });
                    
                    document.documentElement.addEventListener('mouseenter', () => {
                        cursorRing.style.opacity = '1';
                        cursorDot.style.opacity = '1';
                    });
                } else {
                    // Touch device or no fine pointer: hide custom cursor, use default
                    cursorRing.style.display = 'none';
                    cursorDot.style.display = 'none';
                }

                /* ---------- Static twinkling star field ---------- */
                var staticWrap = document.getElementById('starsStatic');
                if (staticWrap) {
                    var sn = reduce ? 20 : 55;
                    for (var i = 0; i < sn; i++) {
                        var s = document.createElement('div');
                        s.className = 'star-static';
                        var size = (Math.random() * 1.6 + 0.8).toFixed(2);
                        s.style.width = size + 'px';
                        s.style.height = size + 'px';
                        s.style.left = (Math.random() * 100) + '%';
                        s.style.top = (Math.random() * 100) + '%';
                        s.style.animationDuration = (2 + Math.random() * 3.5) + 's';
                        s.style.animationDelay = (Math.random() * 4) + 's';
                        staticWrap.appendChild(s);
                    }
                }

                /* ---------- Falling blue stars ---------- */
                var fallWrap = document.getElementById('starsFalling');
                if (fallWrap && !reduce) {
                    var fn = 32;
                    for (var j = 0; j < fn; j++) {
                        var f = document.createElement('div');
                        f.className = 'falling-star';
                        var fs = (Math.random() * 2.4 + 1.6).toFixed(2);
                        f.style.width = fs + 'px';
                        f.style.height = fs + 'px';
                        f.style.left = (Math.random() * 100) + '%';
                        f.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
                        var dur = (7 + Math.random() * 10).toFixed(2);
                        f.style.animationDuration = dur + 's';
                        f.style.animationDelay = (Math.random() * dur * -1) + 's';
                        fallWrap.appendChild(f);
                    }
                }

                /* ---------- Occasional shooting-star comets ---------- */
                var cometWrap = document.getElementById('comets');
                if (cometWrap && !reduce) {
                    function spawnComet() {
                        var c = document.createElement('div');
                        c.className = 'comet';
                        var startX = Math.random() * 55;
                        var startY = Math.random() * 35;
                        var angle = 22 + Math.random() * 22;
                        var dist = 260 + Math.random() * 180;
                        var rad = angle * Math.PI / 180;
                        var cx = Math.cos(rad) * dist;
                        var cy = Math.sin(rad) * dist;
                        c.style.left = startX + '%';
                        c.style.top = startY + '%';
                        c.style.setProperty('--angle', angle + 'deg');
                        c.style.setProperty('--cx', cx + 'px');
                        c.style.setProperty('--cy', cy + 'px');
                        var dur = 0.9 + Math.random() * 0.5;
                        c.style.animation = 'cometMove ' + dur + 's linear forwards';
                        cometWrap.appendChild(c);
                        setTimeout(function() {
                            c.remove();
                        }, dur * 1000 + 100);
                    }
                    function loopComet() {
                        spawnComet();
                        setTimeout(loopComet, 3800 + Math.random() * 4200);
                    }
                    setTimeout(loopComet, 2000);
                }

                /* ---------- Cursor glow + parallax depth ---------- */
                var glow = document.getElementById('cursorGlow');
                var parallax = document.getElementById('parallaxLayer');
                if (fine && !reduce) {
                    document.addEventListener('mousemove', function(e) {
                        if (glow) {
                            glow.style.opacity = '1';
                            glow.style.left = e.clientX + 'px';
                            glow.style.top = e.clientY + 'px';
                        }
                        if (parallax) {
                            var nx = (e.clientX / window.innerWidth - 0.5);
                            var ny = (e.clientY / window.innerHeight - 0.5);
                            parallax.style.transform = 'translate(' + (nx * -16) + 'px,' + (ny * -16) + 'px)';
                        }
                    });
                    document.documentElement.addEventListener('mouseleave', function() {
                        if (glow) glow.style.opacity = '0';
                    });
                }

                /* ---------- Polaroid 3D tilt on hover ---------- */
                var polaroid = document.querySelector('.polaroid');
                if (polaroid) {
                    var settleHandler = function(ev) {
                        if (ev.animationName !== 'settleRotate') return;
                        polaroid.removeEventListener('animationend', settleHandler);
                        if (!fine || reduce) return;
                        polaroid.addEventListener('mousemove', function(e) {
                            var r = polaroid.getBoundingClientRect();
                            var px = (e.clientX - r.left) / r.width - 0.5;
                            var py = (e.clientY - r.top) / r.height - 0.5;
                            polaroid.style.transform = 'rotate(-4deg) perspective(600px) rotateX(' + (py * -10) + 'deg) rotateY(' + (px * 12) + 'deg) scale(1.03)';
                        });
                        polaroid.addEventListener('mouseleave', function() {
                            polaroid.style.transform = 'rotate(-4deg)';
                        });
                    };
                    polaroid.addEventListener('animationend', settleHandler);
                }

                /* ---------- Copy to clipboard ---------- */
                function copyText(text, label) {
                    var toast = document.getElementById('toast');
                    var toastText = document.getElementById('toastText');
                    function show() {
                        toastText.textContent = label;
                        toast.classList.add('show');
                        clearTimeout(window.__toastTimer);
                        window.__toastTimer = setTimeout(function() {
                            toast.classList.remove('show');
                        }, 2000);
                    }
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(text).then(show).catch(show);
                    } else {
                        var ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        try {
                            document.execCommand('copy');
                        } catch (e) {}
                        document.body.removeChild(ta);
                        show();
                    }
                }
