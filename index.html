<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Development - @tswasxyz</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            position: relative;
            cursor: default;
            user-select: none;
        }

        /* ===== LATAR BELAKANG KANVAS PARTIKEL ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== OVERLAY GRID HALUS ===== */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== KONTEN UTAMA ===== */
        .content {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        /* ===== BADGE / LABEL ===== */
        .badge {
            display: inline-block;
            border: 1px solid #ffffff;
            padding: 10px 25px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
            animation: fadeInUp 1.2s ease-out both;
        }

        /* ===== JUDUL DENGAN EFEK GLITCH ===== */
        .glitch-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .glitch {
            font-size: clamp(2rem, 7vw, 4rem);
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            line-height: 1.2;
            position: relative;
            display: inline-block;
            animation: subtle-shift 6s infinite;
        }

        /* Pseudo elemen untuk efek glitch */
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            overflow: hidden;
            opacity: 0.8;
            pointer-events: none;
        }

        .glitch::before {
            animation: glitch-before 3s infinite linear alternate-reverse;
            z-index: -1;
        }

        .glitch::after {
            animation: glitch-after 2.5s infinite linear alternate-reverse;
            z-index: -2;
        }

        /* ===== GARIS PEMBATAS ===== */
        .divider {
            width: 80px;
            height: 2px;
            background: #ffffff;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
            animation: divider-pulse 2s infinite;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            animation: divider-sweep 2s infinite;
        }

        /* ===== PESAN ===== */
        .message {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.9;
            animation: fadeInUp 1.5s ease-out 0.3s both;
        }

        /* ===== TITIK PEMUATAN ===== */
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 35px;
            animation: fadeInUp 1.5s ease-out 0.6s both;
        }

        .loading-dots span {
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: bounce-dot 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: 0s;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* ===== ANIMASI KEYFRAMES ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes subtle-shift {
            0%, 100% { transform: skew(0deg); }
            10% { transform: skew(0deg); }
            11% { transform: skew(1deg); }
            12% { transform: skew(0deg); }
            50% { transform: skew(0deg); }
            51% { transform: skew(-1deg); }
            52% { transform: skew(0deg); }
        }

        @keyframes glitch-before {
            0% {
                clip-path: inset(0 0 80% 0);
                transform: translate(-2px, -2px);
            }
            20% {
                clip-path: inset(50% 0 30% 0);
                transform: translate(2px, 1px);
            }
            40% {
                clip-path: inset(20% 0 60% 0);
                transform: translate(-1px, 2px);
            }
            60% {
                clip-path: inset(70% 0 10% 0);
                transform: translate(2px, -1px);
            }
            80% {
                clip-path: inset(10% 0 70% 0);
                transform: translate(-2px, 1px);
            }
            100% {
                clip-path: inset(0 0 80% 0);
                transform: translate(2px, -2px);
            }
        }

        @keyframes glitch-after {
            0% {
                clip-path: inset(60% 0 20% 0);
                transform: translate(2px, 1px);
            }
            20% {
                clip-path: inset(10% 0 70% 0);
                transform: translate(-2px, -1px);
            }
            40% {
                clip-path: inset(80% 0 10% 0);
                transform: translate(1px, 2px);
            }
            60% {
                clip-path: inset(30% 0 50% 0);
                transform: translate(-1px, -2px);
            }
            80% {
                clip-path: inset(50% 0 40% 0);
                transform: translate(2px, -1px);
            }
            100% {
                clip-path: inset(60% 0 20% 0);
                transform: translate(-2px, 1px);
            }
        }

        @keyframes divider-pulse {
            0%, 100% { width: 80px; }
            50% { width: 120px; }
        }

        @keyframes divider-sweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes bounce-dot {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== RESPONSIF ===== */
        @media (max-width: 600px) {
            .badge {
                font-size: 0.7rem;
                padding: 8px 15px;
                letter-spacing: 2px;
            }
            .glitch {
                letter-spacing: 4px;
            }
            .message {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Kanvas untuk partikel -->
    <canvas id="particles-canvas"></canvas>

    <!-- Overlay grid halus -->
    <div class="grid-overlay"></div>

    <!-- Konten utama -->
    <main class="content">
        <div class="glitch-wrapper">
            <h1 class="glitch" data-text="WEBSITE UNDER DEVELOPMENT">
                WEBSITE UNDER DEVELOPMENT
            </h1>
        </div>

        <div class="divider"></div>

        <p class="message">Come back later :)</p>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </main>

    <script>
        (function() {
            // ===== KONFIGURASI KANVAS PARTIKEL =====
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');

            let particles = [];
            const particleCount = 80;
            const maxDistance = 120;
            const mouse = { x: null, y: null };

            // Ukuran layar
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Buat partikel awal
            function createParticles() {
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        radius: Math.random() * 1.5 + 0.5
                    });
                }
            }
            createParticles();

            // Update posisi partikel
            function updateParticles() {
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;

                    // Bungkus ke sisi lain
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
            }

            // Gambar partikel dan garis
            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Garis antar partikel
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < maxDistance) {
                            const alpha = (1 - distance / maxDistance) * 0.25;
                            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }

                // Titik partikel
                for (let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fill();
                }
            }

            // Loop animasi
            function animate() {
                updateParticles();
                drawParticles();
                requestAnimationFrame(animate);
            }

            animate();

            // Interaksi mouse (opsional, partikel mendekat)
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;

                for (let p of particles) {
                    const dx = p.x - mouse.x;
                    const dy = p.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        p.vx += (dx / dist) * 0.02;
                        p.vy += (dy / dist) * 0.02;
                    }
                }
            });

            window.addEventListener('mouseout', () => {
                mouse.x = null;
                mouse.y = null;
            });
        })();
    </script>
</body>
</html>
